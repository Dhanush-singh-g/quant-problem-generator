x-backend: &backend
  build: {context: ., dockerfile: backend/Dockerfile}
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql+psycopg://quant:${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}@postgres:5432/quantforge
    REDIS_URL: redis://redis:6379/0
    AUTO_CREATE_SCHEMA: "false"
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quantforge
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U quant -d quantforge"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *backend
    command: python -m app.migrate
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
  worker:
    <<: *backend
    command: celery -A app.workers.celery_app:celery worker -Q generation --concurrency=2 --loglevel=info
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, celery, -A, "app.workers.celery_app:celery", inspect, ping, "--timeout=3"]
      interval: 20s
      timeout: 8s
      retries: 5
  scheduler:
    <<: *backend
    command: celery -A app.workers.celery_app:celery beat --loglevel=info --schedule=/tmp/quantforge-beat --pidfile=/tmp/quantforge-beat.pid
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; import os; os.kill(int(Path('/tmp/quantforge-beat.pid').read_text()), 0)"]
      interval: 10s
      timeout: 3s
      retries: 10
  web:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 6s
      retries: 30
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
